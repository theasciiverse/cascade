# Builds Cascade for the Asciiverse catalog: one archive per target, named
# <id>-<target>.tar.gz (Linux, macOS) or .zip (Windows), plus a SHA256SUMS
# file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). Each archive holds the binary at the top,
# where av looks for it, and songs/ beside it: the Bellbeat songs that come
# with the game, ready to play (src/bundled.rs).
#
# Tags look like v0.10.0-av.1: upstream's version, then our release. Linux
# builds are glibc, not static musl: the music goes out through cpal and
# ALSA, linked dynamically, so the binary needs libasound2 (the manifest's
# system_deps). They are built on Ubuntu 22.04, so they run on glibc 2.35
# and newer. macOS and Windows use cpal's own output (Core Audio, WASAPI).
# Rust is pinned to 1.93.1 (rust-toolchain.toml): newer compilers have hung
# on some of our crates. The release step publishes whatever built, so a
# stuck runner never holds back the rest.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: cascade
  BIN: cascade
  TAG: ${{ inputs.tag || github.ref_name }}
  DOCS: LICENSE-MIT LICENSE-APACHE README.md PATCHES.md
  RUSTUP_TOOLCHAIN: "1.93.1"

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
          rustup toolchain install $RUSTUP_TOOLCHAIN --profile minimal
          cargo build --release --locked
          file target/release/$BIN
          # libc, libm, libgcc_s, and libasound, which the manifest declares
          ldd target/release/$BIN
          ! ldd target/release/$BIN | grep -v -E 'linux-vdso|libc\.so|libm\.so|libgcc_s|ld-linux|libasound'

      - name: Test
        run: CASCADE_NO_AUDIO=1 cargo test --release --locked

      - name: Package for av
        run: |
          mkdir -p stage dist
          cp target/release/$BIN $DOCS stage/
          cp -r songs stage/songs
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          rustup toolchain install $RUSTUP_TOOLCHAIN --profile minimal --target ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
          file target/${{ matrix.target }}/release/$BIN

      - name: Package
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/$BIN $DOCS stage/
          cp -r songs stage/songs
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        shell: bash
        run: |
          rustup toolchain install $RUSTUP_TOOLCHAIN --profile minimal --target ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/$BIN.exe $DOCS stage/
          cp -r songs stage/songs
          (cd stage && 7z a -tzip "../dist/$ID-${{ matrix.target }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Cascade $TAG" \
                 --notes "Cascade by Gleb Matsko (github.com/glebmatz/cascade), built for the Asciiverse catalog: one binary for Linux, macOS and Windows, with nine Bellbeat songs ready to play. MIT OR Apache-2.0. Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
